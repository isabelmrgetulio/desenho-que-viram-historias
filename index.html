<title>Desenhos que Viram Histórias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout (cenas ilustradas na versão 4): coluna de celular centrada. Cabeçalho com as ondas coloridas da caixa do kit, conteúdo por abas, barra de abas colada embaixo.
   Cores vêm do kit: azul-marinho da caixa, laranja do lápis, verde-água, lilás e amarelo. Letra Andika (feita para quem está aprendendo a ler) + Baloo 2 nos títulos. */
:root{
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Andika','Trebuchet MS',system-ui,sans-serif;
  --outer:#E3EAF9; --paper:#F6F8FE; --card:#FFFFFF; --soft:#EAF0FF;
  --ink:#1B2A5E; --ink-2:#4A5A8F; --line:#D5DEF4;
  --accent:#FF8A1F; --accent-dk:#C4600A; --on-accent:#1B2A5E;
  --teal:#12998F; --pink:#E0457B; --sun:#FFC83D; --violet:#6D4DD9;
  --ok:#1B8A50; --danger:#C93A3A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --outer:#0A0F26; --paper:#0F1633; --card:#19224A; --soft:#1F2A58;
    --ink:#EEF2FF; --ink-2:#AEB9E6; --line:#2C386F;
    --accent:#FF9A3C; --accent-dk:#9C5110; --teal:#3CCBBE; --pink:#FF7CA6; --sun:#FFD35C; --violet:#A895FF;
    --ok:#4CD08A; --danger:#FF7B7B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --outer:#0A0F26; --paper:#0F1633; --card:#19224A; --soft:#1F2A58;
  --ink:#EEF2FF; --ink-2:#AEB9E6; --line:#2C386F;
  --accent:#FF9A3C; --accent-dk:#9C5110; --teal:#3CCBBE; --pink:#FF7CA6; --sun:#FFD35C; --violet:#A895FF;
  --ok:#4CD08A; --danger:#FF7B7B; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--outer);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column}
@media (min-width:520px){.shell{box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(10,20,60,.18)}}
.ic{flex:none;display:block}

/* cabeçalho */
.top{background:var(--paper)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--sun);display:grid;place-items:center;flex:none}
.bt{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.05;color:var(--ink)}
.bt em{font-style:normal;color:var(--accent)}
.who{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-size:15px;white-space:nowrap}
.waves{display:block;width:100%;height:26px}

/* tipografia */
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.12;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:23px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.lead{color:var(--ink-2);font-size:18px}
.small{font-size:14px;color:var(--ink-2)}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.main{flex:1;padding-block:14px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;width:100%;padding:12px 20px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font-family:var(--font-display);font-weight:800;font-size:20px;box-shadow:0 5px 0 var(--accent-dk);text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-dk)}
.btn[disabled]{background:var(--line);color:var(--ink-2);box-shadow:none;cursor:not-allowed}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink),0 4px 0 var(--ink)}
.btn.sec:active{box-shadow:inset 0 0 0 2.5px var(--ink),0 1px 0 var(--ink)}
.btn.sm{min-height:46px;font-size:17px;border-radius:14px;padding:8px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}

/* etapas */
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:8px;align-items:center}
.stepper li{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:700;font-size:14px}
.stepper li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-family:var(--font-display);font-size:14px}
.stepper li b{display:none;font-weight:700}
.stepper li.done span{background:var(--teal);color:#0B1B3A}
.stepper li.now span{background:var(--accent);color:var(--on-accent)}
.stepper li.now b{display:inline;color:var(--ink)}
.stepper li:not(:last-child)::after{content:"";width:14px;height:3px;border-radius:2px;background:var(--line)}
.stepper li.now:not(:last-child)::after{display:none}

/* controles */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:12px;padding:10px 6px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 0 var(--line),0 2px 6px rgba(20,30,80,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:16px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:700}
.tag{display:inline-block;background:var(--sun);color:#1B2A5E;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:700}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 0 0 2px var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-weight:700;font-size:15px;color:var(--ink-2)}
input[type=text],input[type=number]{width:100%;min-height:54px;border-radius:16px;border:2.5px solid var(--line);background:var(--card);padding:10px 14px;font-size:20px}
input[type=text]:focus{border-color:var(--ink)}

/* desenho */
.cv{display:block;width:100%;height:auto;aspect-ratio:4/3;border-radius:18px;border:3px solid var(--ink);background:#fff;touch-action:none;cursor:crosshair}
.canvas-wrap{position:relative}
.cv-hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#4A5A8F;font-weight:700;pointer-events:none}
.tools{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.pen{width:28px;height:58px;border:0;padding:0;background:var(--c);clip-path:polygon(50% 0,100% 30%,100% 100%,0 100%,0 30%);position:relative;transition:transform .12s}
.pen[aria-pressed="true"]{transform:translateY(-8px)}
.sizes{display:flex;gap:6px;margin-left:auto}
.sz{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.sz[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.tool{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.tool[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sample{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:700;font-size:15px}
.sample img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:10px;background:#fff}
.sample[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.deck{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:18px;padding:12px 14px}
.deck .q{flex:1;font-weight:700;min-width:0}
.deck button{border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 12px;font-weight:700;display:flex;gap:6px;align-items:center;min-height:44px}

/* confirmar */
.frame{background:#fff;border-radius:8px;padding:8px;box-shadow:0 6px 0 rgba(20,30,80,.14);transform:rotate(-1.5deg);max-width:320px;margin:4px auto}
.frame img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
.bubble{background:var(--card);box-shadow:0 0 0 2px var(--line);border-radius:20px 20px 20px 6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bubble .hd{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;color:var(--violet)}
.err{color:var(--danger);font-weight:700;font-size:15px}

/* temas e cartas */
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:0;border-radius:20px;padding:12px 14px;box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line);min-height:76px}
.tile:active{transform:translateY(2px)}
.disk{width:54px;height:54px;border-radius:50%;background:var(--disk);color:#1B2A5E;display:grid;place-items:center;flex:none}
.tile b{font-family:var(--font-display);font-size:21px;display:block;line-height:1.1}
.tile span{color:var(--ink-2);font-size:15px}
.situ{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 0 0 2px var(--line);display:flex;flex-direction:column;gap:12px}
.situ p{font-size:20px;line-height:1.55}
.cards{display:grid;gap:12px}
.playcard{display:flex;gap:14px;align-items:center;text-align:left;border:0;border-radius:20px;padding:14px;background:var(--card);box-shadow:inset 0 0 0 3px var(--ink),0 5px 0 var(--ink);min-height:92px}
.playcard:active{transform:translateY(3px);box-shadow:inset 0 0 0 3px var(--ink),0 2px 0 var(--ink)}
.playcard:nth-child(1){transform:rotate(-.8deg)}.playcard:nth-child(3){transform:rotate(.8deg)}
.playcard .disk{width:58px;height:58px}
.playcard b{font-family:var(--font-display);font-size:21px;display:block;line-height:1.1}
.playcard span{color:var(--ink-2);font-size:16px}

/* gerando */
.making{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.making li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 0 0 2px var(--line);font-weight:700;opacity:.55}
.making li .dot{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.making li.on{opacity:1}
.making li.on .dot{background:var(--sun);color:#1B2A5E;animation:pulse 1s infinite}
.making li.ok{opacity:1}
.making li.ok .dot{background:var(--teal);color:#0B1B3A;animation:none}
@keyframes pulse{50%{transform:scale(1.15)}}

/* livro */
.vbar{display:flex;align-items:center;gap:10px}
.vbar .t{flex:1;min-width:0;font-family:var(--font-display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:48px;height:48px;border-radius:14px;border:0;background:var(--soft);display:grid;place-items:center;flex:none}
.iconbtn[aria-pressed="true"]{background:var(--sun);color:#1B2A5E}
.scene{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:24px;display:flex;align-items:center;box-shadow:0 0 0 3px var(--ink)}
.sc-aventura{background:linear-gradient(#9AD8FF,#FFF0C2)}
.sc-amizade{background:linear-gradient(#FFC6DA,#FFF3C4)}
.sc-descoberta{background:linear-gradient(#CFC2FF,#FFE9B8)}
.sc-natureza{background:linear-gradient(#B9ECFF,#D8F7B8)}
.sc-fantasia{background:linear-gradient(#2B2A7C,#7C5BE0)}
.orn{position:absolute;inset:0;width:100%;height:100%}
.draw{position:relative;z-index:1;margin:0 auto;width:62%;background:#fff;padding:7px;border-radius:5px;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.draw img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
.draw::before{content:"";position:absolute;top:-10px;left:50%;width:64px;height:20px;margin-left:-32px;background:rgba(255,224,120,.85);transform:rotate(-3deg)}
.fig{position:absolute;z-index:2;height:auto;filter:drop-shadow(0 5px 0 rgba(0,0,0,.2));transform-origin:50% 100%}
.bgart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadein .6s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.paint{position:absolute;z-index:3;top:10px;left:10px;background:rgba(255,255,255,.92);color:#1B2A5E;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.orig{position:absolute;z-index:3;right:10px;bottom:10px;width:30%;margin:0;background:#fff;padding:5px 5px 3px;border-radius:4px;box-shadow:0 4px 0 rgba(0,0,0,.18);transform:rotate(4deg);color:#1B2A5E;text-align:center}
.orig img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
.orig figcaption{font-size:12px;font-weight:700;line-height:1.2;padding-top:2px}
.scene2{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:24px;box-shadow:0 0 0 3px var(--ink);background:#9AD8FF}
.scene2 svg{display:block;width:100%;height:100%}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.4deg)}}
.tw{animation:tw 2.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.ptext{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 0 0 2px var(--line);font-size:21px;line-height:1.6;display:flex;flex-direction:column;gap:14px}
.pno{font-size:14px;color:var(--ink-2);font-weight:700}
.cover-t{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.05;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{min-height:64px;border:0;border-radius:16px;background:var(--soft);font-family:var(--font-display);font-weight:800;font-size:22px;box-shadow:inset 0 0 0 2.5px var(--ink)}
.opt.right{background:var(--teal);color:#0B1B3A;box-shadow:none}
.opt.dim{opacity:.55}
.fb{font-size:19px;font-weight:700;color:var(--ink)}
.vnav{display:flex;gap:10px;align-items:center}
.vnav .btn{flex:1}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);transform:scale(1.25)}

/* abas */
.tabbar{position:sticky;bottom:0;z-index:5;background:var(--card);box-shadow:0 -2px 0 var(--line)}
.tabin{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-top:6px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-weight:700;font-size:13px;color:var(--ink-2);min-height:56px}
.tab[aria-current="page"]{color:var(--ink);background:var(--soft)}
.tab[aria-current="page"] .ic{color:var(--accent)}

/* livros, perfil, responsável */
.book{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:10px;box-shadow:0 0 0 2px var(--line)}
.book img{width:92px;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:10px;flex:none}
.book .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.book h3{font-size:19px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.kv dt{color:var(--ink-2);font-size:15px}.kv dd{margin:0;font-weight:700;text-align:right}
dl.kv{margin:0}
.ok{color:var(--ok)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.checks .ic{color:var(--ok);margin-top:2px}
.switch{display:flex;gap:12px;align-items:center;justify-content:space-between}
.sw{width:58px;height:34px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw[aria-checked="true"]{background:var(--teal)}
.sw[aria-checked="true"]::after{left:28px}
.sw[disabled]{opacity:.6}
details{background:var(--soft);border-radius:16px;padding:12px 14px}
details summary{font-weight:700;cursor:pointer;min-height:32px}
details p{margin-top:8px;font-size:16px}
.file{display:flex;align-items:center;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-weight:700;font-size:16px;max-width:min(90vw,440px);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;padding:24px 12px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- tela inicial (aparece toda vez que o app abre) ---------- */
.splash{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;background:#1B2A5E;overflow:hidden;transition:opacity .45s ease,transform .45s ease}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.splash-in{position:relative;width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(28px,env(safe-area-inset-top,0px)) 24px max(26px,env(safe-area-inset-bottom,0px));text-align:center;color:#fff;background:radial-gradient(120% 70% at 50% 0%,#33479A 0%,#1B2A5E 62%)}
.sp-blob{position:absolute;border-radius:50%;pointer-events:none}
.sp-b1{width:360px;height:360px;right:-150px;top:-120px;background:#FFC83D;opacity:.16}
.sp-b2{width:300px;height:300px;left:-130px;bottom:-110px;background:#C9BBFF;opacity:.18}
.sp-top{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#8FE3C5}
.sp-mid{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.sp-paper{width:min(76vw,300px);aspect-ratio:1/0.9;background:#fff;border-radius:14px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);rotate:-3deg;animation:spIn .7s cubic-bezier(.2,1.3,.4,1) both}
.sp-paper svg{display:block;width:100%;height:100%;overflow:visible}
.sp-paper .dr{animation:spDr .9s ease-out both,spFill .5s ease-out both;animation-delay:calc(.5s + var(--k) * .22s),calc(1.1s + var(--k) * .22s)}
.sp-rocket{animation:spFly 3.4s ease-in-out 2.8s infinite}
@keyframes spDr{from{stroke-dashoffset:1}}
@keyframes spFill{from{fill-opacity:0}}
@keyframes spFly{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes spIn{from{opacity:0;transform:translateY(40px) scale(.9)}}
@keyframes spUp{from{opacity:0;transform:translateY(24px)}}
@keyframes spTw{50%{opacity:.35;transform:scale(.7)}}
.sp-title{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1.02;letter-spacing:-.01em;animation:spUp .6s ease-out 1s both}
.sp-title em{display:block;font-style:normal;color:#FF8A1F}
.sp-tag{font-size:18px;line-height:1.35;color:#DCE4FF;max-width:320px;animation:spUp .6s ease-out 1.4s both}
.sp-steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;animation:spUp .6s ease-out 1.8s both}
.sp-steps span{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.sp-bot{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;animation:spUp .6s ease-out 2.1s both}
.sp-go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;width:100%;max-width:360px;border:0;border-radius:20px;background:#FF8A1F;color:#1B2A5E;font-family:var(--font-display);font-weight:800;font-size:24px;box-shadow:0 6px 0 #C4600A;cursor:pointer}
.sp-go:active{transform:translateY(4px);box-shadow:0 2px 0 #C4600A}
.sp-go:focus-visible{outline:3px solid #fff;outline-offset:3px}
.sp-note{font-size:14px;color:#AEB9E6}
.sp-star{position:absolute;width:18px;height:18px;color:#FFC83D;animation:spTw 2.2s ease-in-out infinite}
@media (max-height:640px){.sp-paper{width:200px}.sp-tag{font-size:16px}}
@media (prefers-reduced-motion:reduce){.splash,.splash *{animation:none!important;transition:none!important}}
/* ---------- amigo e moedas ---------- */
button.who{border:0;color:inherit;cursor:pointer;padding:4px 12px 4px 6px;gap:5px}
.who svg.amigo{display:block;flex:none}
.who .coin{color:#E0A100;display:flex}
.who.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.amigo-hero{display:flex;flex-direction:column;gap:12px;align-items:center;position:relative;overflow:hidden}
.coinbar{align-self:flex-end}
.pill.big{font-size:18px;padding:6px 14px;background:var(--sun);color:#1B2A5E}
.pill.big .ic{color:#B97900}
.amigo-hero .stage{width:min(72vw,260px);border-radius:26px;overflow:hidden;box-shadow:0 0 0 3px var(--line)}
.amigo-hero .stage svg{display:block;width:100%;height:auto}
.amigo.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.amigo-hero .bubble{width:100%}
.buy{width:100%;display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:18px;padding:12px}
.buy>div:first-child{display:flex;flex-direction:column}
.rcats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--soft);border-radius:16px;padding:4px}
.rcats button{border:0;background:transparent;border-radius:12px;padding:10px 2px;font-weight:700;font-size:14px;min-height:46px}
.rcats button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 0 var(--line),0 2px 6px rgba(20,30,80,.12)}
.ritems{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ritem{border:0;background:var(--card);border-radius:18px;box-shadow:0 0 0 2px var(--line);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;line-height:1.15;text-align:center}
.ritem svg.amigo{width:100%;height:auto;border-radius:12px}
.ritem[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.ritem .pr{display:flex;align-items:center;gap:3px;font-weight:700;color:var(--ink)}
.ritem .pr .ic{color:#E0A100}
.tag.ok{background:var(--ok);color:#fff}
.ways{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.ways li{display:flex;gap:10px;align-items:center}
.ways li b{min-width:62px;color:var(--accent-dk)}
.conq li{opacity:.6}.conq li.done{opacity:1}.conq li .ic{color:var(--ink-2)}.conq li.done .ic{color:var(--ok)}
.conq li span{display:flex;flex-direction:column}.conq li b{color:var(--ink);min-width:0}.conq small{color:var(--ink-2);font-size:14px}
#coinpop{width:max-content;position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);z-index:30;display:flex;align-items:center;gap:10px;background:#1B2A5E;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:16px;box-shadow:0 10px 26px rgba(10,20,60,.35);opacity:0;pointer-events:none;max-width:92vw}
#coinpop.show{animation:cpop 2.3s ease both}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
#coinpop .cp-n{display:flex;align-items:center;gap:4px;color:#FFC83D;font-size:20px}
.rw-end{display:flex;gap:12px;align-items:center;text-align:left;background:var(--soft);border-radius:20px;padding:10px 12px;width:100%}
.rw-end>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.rw-end span{font-size:15px;color:var(--ink-2)}
.tabin{grid-template-columns:repeat(5,1fr)}
.tab{font-size:12px;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){#coinpop.show{animation:none;opacity:1;transform:translate(-50%,0)}}
</style>

function loadPhoto(file){

function buildStory(o){
  var C=CATS[o.cat], nome=o.nome, tipo=TIPOS[o.tipo].frase;
  var f=function(s){ return s.split('{nome}').join(nome).split('{tipo}').join(tipo); };
  var ch=REFORCO.filter(function(r){ return o.reforco.indexOf(r.id)>-1; })[0] || null;
  var gosto=GOSTOS.filter(function(g){ return o.gostos.indexOf(g.id)>-1; })[0] || null;
  var card=C.cards[o.card];
  var slots={
    intro:{t:f(C.intro)}, situ:{t:f(C.situ)}, choice:{t:f(card.text)},
    chal: ch ? {t:f(CH_INTRO), chal:{q:f(ch.q),opts:ch.opts,ans:ch.ans,exp:f(ch.exp),done:null}} : {t:f(FILL)},
    gosto: {t: gosto ? f(GOSTO_T).split('{gosto}').join(gosto.label) : f(FILL2)},
    ex1:{t:f(C.ex[0])}, ex2:{t:f(C.ex[1])},
    end:{t:f(C.end)+' '+f(CLOSE[o.card])}
  };
  var order={curta:['intro','situ','choice','end'],media:['intro','situ','choice','chal','ex1','end'],longa:['intro','situ','choice','ex1','chal','gosto','ex2','end']}[o.len];
  var pages=[{kind:'cover'}];
  order.forEach(function(k){ var s=slots[k]; pages.push({kind:s.chal?'chal':'text',t:s.t,chal:s.chal||null}); });
  pages.push({kind:'fim'});
  return { id:'b'+Date.now()+Math.floor(Math.random()*1000), title:C.title(nome), cat:o.cat, card:o.card, len:o.len, nome:nome, drawing:o.drawing, pages:pages, example:!!o.example, corrigiu:!!o.corrigiu, elapsed:o.elapsed||null, checks:null };
}
function allText(b){ var out=[]; b.pages.forEach(function(p){ if(p.t) out.push(p.t); if(p.chal) out.push(p.chal.q); }); return out; }
function runChecks(b){
  var texts=allText(b), all=texts.join(' ');
  var sents=all.split(/(?<=[.!?…])\s+/).filter(Boolean);
  var counts=sents.map(function(s){ return s.trim().split(/\s+/).length; });
  var avg=counts.reduce(function(a,c){return a+c;},0)/counts.length, max=Math.max.apply(null,counts);
  var hits=norm(all).split(/[^a-z]+/).filter(function(t){ return BLOCK.indexOf(t)>-1; });
  var r={ tema:!!CATS[b.cat], avg:Math.round(avg*10)/10, max:max, paginas:b.pages.length-2, frasesOk:(avg<=14&&max<=26), hits:hits.length };
  r.ok = r.tema && r.frasesOk && r.hits===0 && r.paginas===LENS[b.len].pages;
  return r;
}
function checkName(n){
  n=n.trim();
  if(n.length<1) return 'Escolha um nome para o personagem.';
  if(!/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ \-]{0,13}$/.test(n)) return 'Use só letras, com até 14 caracteres.';
  var bad=norm(n).split(/[^a-z]+/).some(function(t){ return BLOCK.indexOf(t)>-1; });
  if(bad) return 'Vamos escolher outro nome? Esse não pode ser usado.';
  return '';
}

function cutoutPixels(px,w,h){
  var br=0,bg=0,bb=0,n=0,k,i;
  function take(x,y){ i=(y*w+x)*4; if(Math.min(px[i],px[i+1],px[i+2])>150){ br+=px[i]; bg+=px[i+1]; bb+=px[i+2]; n++; } }
  for(k=0;k<w;k+=3){ take(k,0); take(k,h-1); } for(k=0;k<h;k+=3){ take(0,k); take(w-1,k); }
  if(n){ br/=n; bg/=n; bb/=n; } else { br=bg=bb=255; }
  var seen=new Uint8Array(w*h), stack=[];
  function dist(j){ return Math.max(Math.abs(px[j]-br),Math.abs(px[j+1]-bg),Math.abs(px[j+2]-bb)); }
  function push(x,y){ var q=y*w+x; if(!seen[q]&&dist(q*4)<46){ seen[q]=1; stack.push(q); } }
  for(k=0;k<w;k++){ push(k,0); push(k,h-1); } for(k=0;k<h;k++){ push(0,k); push(w-1,k); }
  while(stack.length){ var q=stack.pop(), x=q%w, y=(q/w)|0; if(x>0)push(x-1,y); if(x<w-1)push(x+1,y); if(y>0)push(x,y-1); if(y<h-1)push(x,y+1); }
  var minX=w,minY=h,maxX=-1,maxY=-1;
  for(var yy=0;yy<h;yy++){ for(var xx=0;xx<w;xx++){ var z=yy*w+xx; if(seen[z]){ px[z*4+3]=0; } else { if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(yy<minY)minY=yy; if(yy>maxY)maxY=yy; } } }
  return {minX:minX,minY:minY,maxX:maxX,maxY:maxY};
}
function makeCutout(url){
  return new Promise(function(res){
    var fail=function(){ res({uri:url,ar:4/3}); };
    try{
      var im=new Image();
      im.onload=function(){
        try{
          var nw=im.naturalWidth||0, nh=im.naturalHeight||0;
          if(url.indexOf('data:image/svg')===0||!nw||!nh){ nw=480; nh=360; }
          var sc=Math.min(1,480/Math.max(nw,nh)), w=Math.max(1,Math.round(nw*sc)), h=Math.max(1,Math.round(nh*sc));
          var c=document.createElement('canvas'); c.width=w; c.height=h; var x=c.getContext('2d');
          x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
          var d=x.getImageData(0,0,w,h), bb=cutoutPixels(d.data,w,h);
          var bw=bb.maxX-bb.minX+1, bh=bb.maxY-bb.minY+1;
          if(bb.maxX<0||bw*bh<w*h*0.03){ fail(); return; }
          x.putImageData(d,0,0);
          var pad=6, sx=Math.max(0,bb.minX-pad), sy=Math.max(0,bb.minY-pad), ex=Math.min(w,bb.maxX+pad+1), ey=Math.min(h,bb.maxY+pad+1);
          var c2=document.createElement('canvas'); c2.width=ex-sx; c2.height=ey-sy;
          c2.getContext('2d').drawImage(c,sx,sy,ex-sx,ey-sy,0,0,ex-sx,ey-sy);
          res({uri:c2.toDataURL('image/png'),ar:(ex-sx)/(ey-sy)});
        }catch(e){ fail(); }
      };
      im.onerror=fail; im.src=url;
    }catch(e){ fail(); }
  });
}

var SVG_OK={svg:1,g:1,defs:1,rect:1,circle:1,ellipse:1,path:1,polygon:1,polyline:1,line:1,lineargradient:1,radialgradient:1,stop:1};
var SVG_ATTR={xmlns:1,viewbox:1,x:1,y:1,cx:1,cy:1,r:1,rx:1,ry:1,d:1,points:1,x1:1,y1:1,x2:1,y2:1,fill:1,stroke:1,'stroke-width':1,'stroke-linecap':1,'stroke-linejoin':1,opacity:1,'fill-opacity':1,'stroke-opacity':1,transform:1,id:1,offset:1,'stop-color':1,'stop-opacity':1,gradientunits:1,gradienttransform:1,fx:1,fy:1,'fill-rule':1,width:1,height:1};
function sanitizeSVG(str){
  if(typeof str!=='string'||str.length>40000||typeof DOMParser==='undefined') return null;
  var m=str.match(/<svg[\s\S]*<\/svg>/i); if(!m) return null;
  try{
    var doc=new DOMParser().parseFromString(m[0],'image/svg+xml');
    if(doc.getElementsByTagName('parsererror').length) return null;
    var root=doc.documentElement;
    if(!root||root.localName.toLowerCase()!=='svg') return null;
    var count=0;
    function clean(el){
      Array.prototype.slice.call(el.attributes).forEach(function(a){
        var n=a.name.toLowerCase(), v=String(a.value);
        var bad=!SVG_ATTR[n] || /javascript|data:|<|&#|@import/i.test(v) || (/url\(/i.test(v) && !/^url\(#[\w-]+\)$/.test(v.trim()));
        if(bad) el.removeAttribute(a.name);
      });
    }
    (function walk(n){
      Array.prototype.slice.call(n.children).forEach(function(k){
        if(!SVG_OK[k.localName.toLowerCase()]){ n.removeChild(k); return; }
        count++; clean(k); walk(k);
      });
    })(root);
    if(count<4||count>200) return null;
    clean(root);
    root.removeAttribute('width'); root.removeAttribute('height');
    root.setAttribute('viewBox','0 0 400 300');
    if(!root.getAttribute('xmlns')) root.setAttribute('xmlns','http://www.w3.org/2000/svg');
    return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(root));
  }catch(e){ return null; }
}

function cleanArt(o){
  if(!o||typeof o!=='object') return null;
  var uri=sanitizeSVG(o.svg); if(!uri) return null;
  var cl=function(v,a,b,d){ v=+v; return isFinite(v)?Math.min(b,Math.max(a,v)):d; };
  return {uri:uri,x:cl(o.x,20,80,50),y:cl(o.y,70,92,86),s:cl(o.escala,0.3,0.5,0.42),r:cl(o.giro,-12,12,0),flip:o.espelhar===true};
}

var paintQ=[], paintActive=0;
function paintBook(b){
  b.art=b.pages.map(function(){ return {status:'none'}; });
  b.pages.forEach(function(p,i){ if(p.kind!=='fim'){ b.art[i].status='queued'; paintQ.push({b:b,i:i}); } });
  refreshScene(b,S.page); pump();
}
function pump(){
  while(paintActive<2&&paintQ.length){
    var t=paintQ.shift();
    if(t.b.stop){ t.b.art[t.i].status='failed'; refreshScene(t.b,t.i); continue; }
    paintActive++;
    paintPage(t.b,t.i).then(function(){ paintActive--; pump(); });
  }
}
async function paintPage(b,i){
  var art=b.art[i]; art.status='loading'; refreshScene(b,i);
  try{
    var out=await S.ai.sample.json(scenePrompt(b,i),{modelTier:'default'});
    var c=cleanArt(out); if(!c) throw {code:'bad_shape'};
    art.uri=c.uri; art.x=c.x; art.y=c.y; art.s=c.s; art.r=c.r; art.flip=c.flip; art.status='ready';
  }catch(e){
    art.status='failed';
    var code=e&&e.code;
    if(code && code!=='bad_shape' && code!=='invalid_json' && code!=='empty_completion' && code!=='upstream_error' && code!=='refused'){
      b.stop=true;
      if(!b.warned){ b.warned=true; toast('As ilustrações da IA pararam. As outras páginas usam cenários prontos.'); }
      if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'){ S.ai.status='off'; updatePill(); }
    }
  }
  refreshScene(b,i);
}

async function makeAI(p,rid){
  var ctl=new AbortController(); S.ctl=ctl;
  var book=null, tries=0;
  try{
    mk(0);
    for(tries=1;tries<=3;tries++){
      mk(1);
      var gen=await aiStory(p,ctl.signal); if(rid!==S.rid) return;
      if(!gen) continue;
      var b=bookFromAI(p,gen); mk(2);
      var lc=runChecks(b); if(!lc.ok) continue;
      var ok=await aiReview(allText(b),ctl.signal); if(rid!==S.rid) return;
      if(!ok) continue;
      lc.ia=true; lc.tentativa=tries; lc.revisor=true; b.checks=lc; book=b; break;
    }
  }catch(e){
    if(rid!==S.rid) return;
    if(e&&e.code==='cancelled') return;
    aiFail(e);
  }
  if(rid!==S.rid) return;
  if(!book){ if(tries>3) toast('A IA não passou na verificação. Usei uma história pronta.'); book=templateBook(p); }
  mk(3);
  setTimeout(function(){ if(rid===S.rid) finishBook(book); },500);
}
function makeTemplate(p,rid){
  var k=0;
  function tick(){
    if(rid!==S.rid) return;
    mk(k);
    if(k<4){ k++; setTimeout(tick,700); return; }
    var b=templateBook(p);
    if(!b.checks.ok){ S.step='confirm'; S.editing=true; S.nameErr='A história não passou na verificação. Tente outro nome ou outro tema.'; render(true); return; }
    finishBook(b);
  }
  tick();
}
function runMaking(card){

}

    var own=rHas(i), eqd=R.eq[i.cat]===i.id, prv=R.prev&&R.prev.cat===i.cat&&R.prev.id===i.id;
    var e=Object.assign({},{cor:'menta',chapeu:'nenhum',rosto:'nenhum',extra:'nenhum',fundo:'ceu'}); e[i.cat]=i.id;
    var st=eqd?'<span class="tag ok">Em uso</span>':own?'<span class="small">Meu</span>':'<span class="small pr">'+ic('coin',16)+i.p+'</span>';
    var vb=(i.cat==='chapeu'||i.cat==='rosto')?'30 0 140 150':'0 0 200 220';
    return '<button class="ritem" data-act="ritem" data-cat="'+i.cat+'" data-id="'+i.id+'" aria-pressed="'+(eqd||!!prv)+'" aria-label="'+esc(i.nome)+', '+(eqd?'em uso':own?'seu':i.p+' moedas')+'">'+amigoSVG(e,{w:76,vb:vb,bg:true,label:i.nome})+'<b>'+esc(i.nome)+'</b>'+st+'</button>';
  }).join('');
  return '<div class="card amigo-hero"><div class="coinbar"><span class="pill big">'+ic('coin',22)+'<b>'+R.coins+'</b> moedas</span></div>'+
    '<div class="stage">'+amigoSVG(sh,{w:220,bg:true,cls:'bob',label:R.nome})+'</div>'+
    '<div class="bubble"><p><b>'+esc(R.nome)+':</b> '+esc(frase)+'</p></div>'+buy+'</div>'+
    '<div class="card stack"><div class="field"><label for="amigo-nome">Nome do seu amigo</label><div style="display:flex;gap:8px;align-items:stretch"><input id="amigo-nome" type="text" maxlength="14" autocomplete="off" value="'+esc(R.nome)+'" style="flex:1;min-width:0;width:100%"><button class="btn sm" style="width:auto" data-act="rname">Salvar</button></div></div><div class="err" role="alert">'+esc(R.err)+'</div></div>'+
    '<div class="rcats" role="group" aria-label="Tipo de item">'+RCATS.map(function(c){ return '<button data-act="rcat" data-v="'+c[0]+'" aria-pressed="'+(R.cat===c[0])+'">'+c[1]+'</button>'; }).join('')+'</div>'+
    '<div class="ritems">'+items+'</div>'+
    '<div class="card stack"><h3>Como ganhar moedas</h3><ul class="ways"><li><b>+10</b> Criar uma história</li><li><b>+5</b> Ler até o fim</li><li><b>+5</b> Acertar um enigma (+2 só por tentar)</li><li><b>+10 a +15</b> Conquistas</li></ul></div>'+
    '<div class="card stack"><h3>Conquistas</h3><ul class="ways conq">'+CONQ.map(function(c){ var d=!!R.ach[c.id]; return '<li class="'+(d?'done':'')+'">'+ic(d?'check':'lock',20)+'<span><b>'+c.nome+'</b><small>'+c.desc+' (+'+c.b+')</small></span></li>'; }).join('')+'</ul></div>';
}
function rwActs(a,d,el){
  switch(a){
    case 'rcat': R.cat=d.v; R.prev=null; render(); return true;
    case 'ritem': var it=rItem(d.cat,d.id); if(!it) return true; if(rHas(it)){ R.eq[it.cat]=it.id; R.prev=null; rSave(); } else { R.prev={cat:it.cat,id:it.id}; } render(); return true;
    case 'rcancel': R.prev=null; render(); return true;
    case 'rbuy': var p=R.prev&&rItem(R.prev.cat,R.prev.id); if(p&&R.coins>=p.p){ R.coins-=p.p; R.owned[p.cat+':'+p.id]=1; R.eq[p.cat]=p.id; R.prev=null; rSave(); toast('Agora é seu: '+p.nome+'!'); rConq(null); } render(); return true;
    case 'rname': var inp=$('#amigo-nome'), v=inp?inp.value:''; var er=checkName(v); R.err=er; if(!er){ R.nome=v.trim(); rSave(); toast('Agora ele se chama '+R.nome+'!'); } render(); return true;
    case 'rtog': R.on=!R.on; rSave(); render(); return true;
    case 'rreset': if(!R.confirmReset){ R.confirmReset=true; render(); } else { R.confirmReset=false; var keep=R.on; R.coins=WELCOME; R.owned={}; R.eq={cor:'menta',chapeu:'nenhum',rosto:'nenhum',extra:'nenhum',fundo:'ceu'}; R.ach={}; R.stats={certas:0,lidos:0,feitos:0}; R.today=0; R.prev=null; R.nome='Pipo'; R.on=keep; rSave(); toast('Progresso do amigo zerado.'); render(); } return true;
  }
  return false;
}
function rwParents(){
  rDay();
  return '<div class="card stack"><div class="switch"><div><h3>Amigo e moedas</h3><p class="small">A criança ganha moedas ao criar, ler e resolver enigmas, e usa para vestir o amigo.</p></div><button class="sw" role="switch" aria-checked="'+R.on+'" aria-label="Recompensas com moedas" data-act="rtog"></button></div>'+
    '<dl class="kv"><dt>Moedas hoje</dt><dd>'+R.today+' de '+DAILY_CAP+'</dd><dt>Moedas na carteira</dt><dd>'+R.coins+'</dd><dt>Histórias criadas</dt><dd>'+R.stats.feitos+'</dd></dl>'+
    '<p class="small">As moedas só existem dentro do app: não custam dinheiro, não há compras, anúncios nem sorteios. Há um limite diário de '+DAILY_CAP+' moedas e nada é cobrado nem perdido se a criança ficar um dia sem usar.</p>'+
    '<button class="btn sec sm" data-act="rreset">'+ic('trash',20)+(R.confirmReset?'Toque de novo para confirmar':'Zerar progresso do amigo')+'</button></div>';
}
function whoChip(){
  if(!R.on) return '<div class="who">'+ic('user',18)+esc(P.nome||'Criança')+'</div>';
  return '<button class="who" data-act="tab" data-v="amigo" aria-label="Meu amigo, '+R.coins+' moedas">'+amigoSVG(R.eq,{w:30,vb:'4 0 192 200',label:''})+'<span class="coin">'+ic('coin',18)+'</span><b class="cn">'+R.coins+'</b></button>';
}

function rwEnd(b){ if(!R.on||b.example) return ''; var g=b.coins||0; return '<div class="rw-end">'+amigoSVG(R.eq,{w:84,vb:'4 0 192 200',label:R.nome})+'<div><b>'+(g?'Você ganhou '+g+' moedas nesta história!':'Você já pegou as moedas desta história.')+'</b><span>'+esc(R.nome)+' tem '+R.coins+' moedas para vestir.</span><button class="btn sm" data-act="tab" data-v="amigo">Ver meu amigo</button></div></div>'; }

/* ---------- render e eventos ---------- */
function screen(){
  if(S.viewing!==null) return viewer();
  if(S.tab==='criar'){
    if(S.paused) return pausedView();
    return ({draw:stepDraw,confirm:stepConfirm,category:stepCategory,situation:stepSituation,making:stepMaking})[S.step]();
  }
  return ({livros:livros,amigo:amigo,perfil:perfil,pais:pais})[S.tab]();
}
function render(top){
  var app=$('#app');
  app.innerHTML=header()+'<main class="pad main" id="main">'+screen()+'</main>'+(S.viewing===null?tabbar():'');
  var slot=$('#cv-slot'); if(slot) slot.appendChild(CV);
  if(top) window.scrollTo(0,0);
}
var toastT=null;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },3000); }
function stopSpeech(){ try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){} S.speaking=false; }
function speak(text,btn){
  try{
    var ss=window.speechSynthesis;
    if(!ss||typeof SpeechSynthesisUtterance==='undefined'){ toast('Este aparelho não tem leitura em voz alta.'); return; }
    if(S.speaking){ stopSpeech(); if(btn) btn.setAttribute('aria-pressed','false'); return; }
    var u=new SpeechSynthesisUtterance(text); u.lang='pt-BR'; u.rate=0.9;
    u.onend=u.onerror=function(){ S.speaking=false; if(btn) btn.setAttribute('aria-pressed','false'); };
    S.speaking=true; if(btn) btn.setAttribute('aria-pressed','true'); ss.speak(u);
  }catch(e){ toast('Não consegui ler em voz alta agora.'); }
}
function openBook(i){ stopSpeech(); S.viewing=i; S.page=0; render(true); }
function resetCreate(){ S.step='draw'; S.cat=null; S.editing=false; S.nameErr=''; S.t0=null; S.interp={nome:'',tipo:'',itens:[],desc:'',nomes:NOMES,source:'exemplo',corrigiu:false,loading:false}; if(S.mode!=='exemplos'){ clearCV(); } }
function act(a,d,el){
  if(rwActs(a,d,el)) return;
  switch(a){
    case 'tab': stopSpeech(); S.viewing=null; R.prev=null; R.confirmReset=false; S.tab=d.v; S.adultOK=false; S.gateErr=false; render(true); break;
    case 'mode': S.mode=d.v; render(); break;
    case 'sample': S.sampleId=d.v; render(); break;
    case 'pen': S.pen=d.v; S.eraser=false; document.querySelectorAll('.pen').forEach(function(p){ p.setAttribute('aria-pressed',String(p.dataset.v===S.pen)); }); var er=$('[data-act="eraser"]'); if(er) er.setAttribute('aria-pressed','false'); break;
    case 'eraser': S.eraser=!S.eraser; document.querySelectorAll('.pen').forEach(function(p){ p.setAttribute('aria-pressed',String(!S.eraser&&p.dataset.v===S.pen)); }); el.setAttribute('aria-pressed',String(S.eraser)); break;
    case 'size': S.size=+d.v; document.querySelectorAll('.sz').forEach(function(p){ p.setAttribute('aria-pressed',String(+p.dataset.v===S.size)); }); break;
    case 'clear': clearCV(); refreshCTA(); break;
    case 'inspira': S.inspira=(S.inspira+1)%INSPIRA.length; render(); break;
    case 'toConfirm':
      S.t0=S.t0||Date.now(); S.rid++;
      var src = S.mode==='exemplos' ? 'exemplo' : 'proprio';
      if(src==='exemplo'){ S.drawingURL=samplesById(S.sampleId).uri; } else { S.drawingURL=CV.toDataURL('image/jpeg',0.88); }
      S.nameErr=''; S.step='confirm';
      if(aiOn() && (S.ai.images)){
        S.interp={nome:'',tipo:'',itens:[],desc:'',nomes:NOMES,source:src,corrigiu:false,loading:true}; S.editing=false; render(true);
        describeDrawing(src,S.rid);
      } else { fallbackDesc(src); render(true); }
      break;
    case 'backDraw': if(S.ctl){ try{S.ctl.abort();}catch(x){} } S.rid++; S.interp.loading=false; S.step='draw'; render(true); break;
    case 'cancelMake': if(S.ctl){ try{S.ctl.abort();}catch(x){} } S.rid++; S.step='situation'; render(true); break;
    case 'ai': S.useAI=!S.useAI; render(); break;
    case 'yes': S.step='category'; render(true); break;
    case 'fix': S.editing=true; S.interp.corrigiu=true; render(); break;
    case 'tipo': S.interp.tipo=d.v; if(S.interp.desc) S.interp.corrigiu=true; render(); break;
    case 'sug': S.interp.nome=d.v; S.nameErr=''; render(); break;
    case 'confirmEdit':
      var inp=$('#nome'); if(inp) S.interp.nome=inp.value;
      if(!S.interp.tipo){ S.nameErr='Escolha o que é o personagem.'; render(); break; }
      var er2=checkName(S.interp.nome); if(er2){ S.nameErr=er2; render(); break; }
      S.nameErr=''; S.step='category'; render(true); break;
    case 'backConfirm': S.step='confirm'; render(true); break;
    case 'cat': S.cat=d.v; S.step='situation'; render(true); break;
    case 'backCat': S.step='category'; render(true); break;
    case 'listen': speak(el.dataset.text||'',el); break;
    case 'card': runMaking(d.v); break;
    case 'openBook': openBook(+d.i); break;
    case 'closeBook': stopSpeech(); S.viewing=null; S.tab='livros'; render(true); break;
    case 'prev': stopSpeech(); S.page=Math.max(0,S.page-1); render(true); break;
    case 'next': stopSpeech(); S.page=Math.min(S.books[S.viewing].pages.length-1,S.page+1); if(S.page===S.books[S.viewing].pages.length-1) rwRead(S.books[S.viewing]); render(true); break;
    case 'restart': stopSpeech(); S.page=0; render(true); break;
    case 'again': stopSpeech(); S.viewing=null; S.tab='criar'; resetCreate(); render(true); break;
    case 'answer': var pg=S.books[S.viewing].pages[S.page]; if(pg.chal.done===null){ pg.chal.done=pg.chal.opts[+d.i]; rwAnswer(S.books[S.viewing],pg); render(); } break;
    case 'len': S.len=d.v; render(); break;
    case 'idade': P.idade=+d.v; render(); break;
    case 'ano': P.ano=d.v; render(); break;
    case 'reforco': toggle(P.reforco,d.v); render(); break;
    case 'gosto': toggle(P.gostos,d.v); render(); break;
    case 'gate': var g=$('#gate'); if(g&&g.value.trim()==='56'){ S.adultOK=true; S.gateErr=false; } else { S.gateErr=true; } render(); break;
    case 'pause': S.paused=!S.paused; render(); break;
    case 'store': S.store=!S.store; render(); break;
    case 'wipe': S.books=[]; clearCV(); S.drawingURL=null; toast('Desenhos e livros desta sessão foram excluídos.'); render(); break;
  }
}
function toggle(arr,v){ var i=arr.indexOf(v); if(i>-1) arr.splice(i,1); else arr.push(v); }

document.addEventListener('click',function(e){ var t=e.target.closest('[data-act]'); if(!t||t.disabled) return; act(t.dataset.act,t.dataset,t); });
document.addEventListener('input',function(e){
  if(e.target.id==='nome'){ S.interp.nome=e.target.value; S.nameErr=''; var n=$('#nerr'); if(n) n.textContent=''; }
  if(e.target.id==='pf-nome'){ P.nome=e.target.value; }
});
document.addEventListener('change',function(e){
  if(e.target.id==='photo'&&e.target.files&&e.target.files[0]) loadPhoto(e.target.files[0]);
  if(e.target.id==='boletim'&&e.target.files&&e.target.files[0]){ P.boletim=e.target.files[0].name; render(); }
  if(e.target.id==='pf-nome'){ render(); }
});
document.addEventListener('keydown',function(e){
  if(S.viewing===null||e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') act('next',{}); else if(e.key==='ArrowLeft') act('prev',{});
});

/* ---------- livro de exemplo para a aba Livros não abrir vazia ---------- */
(function seed(){
  var sm=samplesById('foguete');
  var b=buildStory({cat:'aventura',card:'descobrir',len:'media',nome:sm.nome,tipo:sm.tipo,drawing:sm.uri,reforco:P.reforco,gostos:P.gostos,example:true,elapsed:null});
  b.checks=runChecks(b); b.checks.ia=false; b.checks.tentativa=1; S.books.push(b);
  makeCutout(sm.uri).then(function(c){ b.cutout=c.uri; b.car=c.ar; });
})();

/* tela inicial: aparece toda vez que o app abre */
(function splash(){
  var el=document.getElementById('splash'), go=document.getElementById('splash-go');
  if(!el||!go) return;
  document.body.style.overflow='hidden';
  var shell=document.getElementById('app'); if(shell) shell.setAttribute('aria-hidden','true');
  function close(){
    if(el.classList.contains('out')) return;
    el.classList.add('out'); document.body.style.overflow='';
    if(shell) shell.removeAttribute('aria-hidden');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },500);
  }
  go.addEventListener('click',close);
  setTimeout(function(){ try{go.focus({preventScroll:true});}catch(e){} },2300);
})();

render();
})();
</script>
